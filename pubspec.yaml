name: ln_app
description: LectureNote AI mobile client.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # State management. Riverpod over Provider/Bloc: compile-safe dependency
  # graph, trivial to override in tests, no BuildContext needed to read state.
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Routing with declarative redirects, which is what makes auth gating clean.
  go_router: ^18.0.1

  # HTTP client. Chosen over `http` for its interceptor pipeline - the silent
  # token refresh below is impractical without it.
  dio: ^5.7.0

  # Tokens must not sit in SharedPreferences: Keychain on iOS, EncryptedSharedPreferences on Android.
  flutter_secure_storage: ^11.0.0

  # Immutable models + JSON codegen.
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  flutter_markdown_plus: ^1.0.12
  file_picker: ^12.2.0
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  crypto: ^3.0.7
  flutter_blue_plus: ^2.3.12
  flutter_ble_peripheral: ^3.1.0
  permission_handler: 12.0.1
  flutter_foreground_task: ^11.0.3
  geolocator: ^14.0.3
  cryptography: ^2.9.0
  local_auth: ^3.0.2
  android_id: ^0.5.2+1
  image_picker: ^1.2.3
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  freezed: ^4.0.1
  json_serializable: ^6.9.0
  riverpod_generator: ^4.0.9

  mocktail: ^1.0.4
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
