org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag is required by the current Flutter Gradle plugin.
android.newDsl=false
# This builtInKotlin flag is required by the current Flutter Gradle plugin.
android.builtInKotlin=false

# The file_picker plugin fails to close its Kotlin incremental caches on
# Windows, which aborts the build with an AssertionError. Turning incremental
# compilation off avoids it at the cost of slightly slower rebuilds.
kotlin.incremental=false
